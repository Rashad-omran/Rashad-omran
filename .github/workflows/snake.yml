name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rashad-omran
          outputs: |
            dist/snake.svg?color_snake=%236366F1&color_dots=%23EBEDF0,%23C4B5FD,%238B5CF6,%236366F1,%2338BDF8
            dist/snake-dark.svg?palette=github-dark&color_snake=%23818CF8&color_dots=%23020617,%23312E81,%234F46E5,%237C3AED,%2338BDF8

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
