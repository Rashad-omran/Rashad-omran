name: Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rashad-omran
          filename: assets/overview.svg

          template: classic
          base: header, activity, repositories, metadata

          config_timezone: Europe/Malta
          config_display: large
          config_animations: yes

          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: Rashad-omran, rashadomran03@gmail.com

  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Language Distribution
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rashad-omran
          filename: assets/languages.svg

          template: classic
          base: ""

          config_timezone: Europe/Malta
          config_display: large

          repositories_affiliations: owner, collaborator, organization_member

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

  contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Contribution Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rashad-omran
          filename: assets/contributions.svg

          template: classic
          base: ""

          config_timezone: Europe/Malta
          config_display: large
          config_animations: yes

          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: Rashad-omran, rashadomran03@gmail.com

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
