name: Profile Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:

  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Contribution Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Rashad-omran
          filename: assets/activity.svg

          template: classic
          base: ""

          config_timezone: Europe/Malta
          config_display: large
          config_animations: yes

          repositories_affiliations: owner, collaborator, organization_member

          commits_authoring: Rashad-omran, rashadomran03@gmail.com

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          output_action: commit

          committer_branch: main
          committer_message: "chore: update contribution activity [Skip GitHub Action]"


  languages:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Language Distribution
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Rashad-omran
          filename: assets/languages.svg

          template: classic
          base: ""

          config_timezone: Europe/Malta
          config_display: large
          config_animations: yes

          repositories_affiliations: owner, collaborator, organization_member

          commits_authoring: Rashad-omran, rashadomran03@gmail.com

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%

          output_action: commit

          committer_branch: main
          committer_message: "chore: update language metrics [Skip GitHub Action]"
