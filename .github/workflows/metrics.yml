name: Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:

  languages:
    name: Generate Language Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Generate languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: Rashad-omran
          filename: assets/languages.svg

          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          config_timezone: Europe/Malta


  streak:
    name: Generate Contribution Streak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate streak.svg
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python .github/scripts/generate-streak.py

      - name: Commit streak.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution streak [skip ci]"
            git pull --rebase origin main
            git push
          fi


  activity:
    name: Generate Contribution Activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Rashad-omran
          token: ${{ secrets.PROFILE_TOKEN }}
          output_path: assets/contribution-graph.svg
          options: theme=github-compact&hide_border=true&area=true&custom_title=Contribution%20Activity&height=300

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution activity [skip ci]"
            git pull --rebase origin main
            git push
          fi
