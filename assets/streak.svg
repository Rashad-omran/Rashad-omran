
<svg
  width="900"
  height="220"
  viewBox="0 0 900 220"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GitHub contribution statistics"
>

<defs>

  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="50%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#7C3AED"/>
  </linearGradient>

</defs>

<style>

.title {
  font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  fill: #F8FAFC;
}

.number {
  font: 700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  fill: #F8FAFC;
}

.current {
  font: 700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  fill: #818CF8;
}

.label {
  font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  fill: #94A3B8;
}

.small {
  font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  fill: #64748B;
}

.divider {
  stroke: #1E293B;
  stroke-width: 1;
}

</style>

<!-- Background -->

<rect
  x="1"
  y="1"
  width="898"
  height="218"
  rx="12"
  fill="#020617"
  stroke="#1E293B"
/>

<!-- Accent -->

<rect
  x="0"
  y="0"
  width="900"
  height="3"
  rx="2"
  fill="url(#accent)"
/>

<!-- Title -->

<text
  x="450"
  y="39"
  text-anchor="middle"
  class="title"
>
Contribution Streak
</text>

<!-- Dividers -->

<line
  x1="300"
  y1="70"
  x2="300"
  y2="185"
  class="divider"
/>

<line
  x1="600"
  y1="70"
  x2="600"
  y2="185"
  class="divider"
/>

<!-- TOTAL -->

<text
  x="150"
  y="118"
  text-anchor="middle"
  class="number"
>
1,821
</text>

<text
  x="150"
  y="151"
  text-anchor="middle"
  class="label"
>
TOTAL CONTRIBUTIONS
</text>

<text
  x="150"
  y="176"
  text-anchor="middle"
  class="small"
>
2026
</text>

<!-- CURRENT -->

<text
  x="450"
  y="118"
  text-anchor="middle"
  class="current"
>
4
</text>

<text
  x="450"
  y="151"
  text-anchor="middle"
  class="label"
>
CURRENT STREAK
</text>

<text
  x="450"
  y="176"
  text-anchor="middle"
  class="small"
>
days
</text>

<!-- LONGEST -->

<text
  x="750"
  y="118"
  text-anchor="middle"
  class="number"
>
17
</text>

<text
  x="750"
  y="151"
  text-anchor="middle"
  class="label"
>
LONGEST STREAK
</text>

<text
  x="750"
  y="176"
  text-anchor="middle"
  class="small"
>
days
</text>

</svg>
